# =============================================================================
# 各保険会社ごとの PDF 抽出ルール定義
# =============================================================================
#
# ここに「各社から届く PDF のどこに、どの項目が書いてあるか」を定義します。
# 実際の PDF サンプルを見てから、正規表現(regex)を調整するだけで対応できます。
#
# 【仕組み】
#   1. PDF からテキストを丸ごと抜き出す
#   2. detect の keyword でどの会社の様式かを自動判定する
#   3. fields の正規表現で各項目の値を切り出す
#
# 【各項目の書き方】
#   regex   : 値を切り出す正規表現。丸カッコ () のグループ1が抽出値になります。
#   flags   : (任意) "IGNORECASE" など。省略可。
#   post    : (任意) 後処理。"digits"=数字のみ抽出 / "strip"=前後空白除去 /
#             "date"=日付を YYYY-MM-DD に正規化
#
# 会社を追加するときは、この形式でブロックを増やすだけです。
# =============================================================================

# ---- 既定(どの会社にも一致しなかった場合に使う汎用ルール) ----
_default:
  fields:
    証券番号:
      regex: "(?:証券番号|証券No|保険証券番号)[\\s:：]*([A-Za-z0-9\\-]+)"
      post: strip
    契約者名:
      regex: "(?:契約者|ご契約者|被保険者)(?:氏名|名)?[\\s:：]*([^\\n\\r]+)"
      post: strip
    登録番号:
      regex: "(?:登録番号|車両番号|自動車登録番号)[\\s:：]*([^\\n\\r]+)"
      post: strip
    車台番号:
      regex: "(?:車台番号)[\\s:：]*([A-Za-z0-9\\-]+)"
      post: strip
    保険期間_開始:
      regex: "保険期間[\\s:：]*(\\d{4}[年/\\-]\\s*\\d{1,2}[月/\\-]\\s*\\d{1,2})"
      post: date
    保険期間_終了:
      regex: "(?:から|〜|～|-)\\s*(\\d{4}[年/\\-]\\s*\\d{1,2}[月/\\-]\\s*\\d{1,2}日?)\\s*まで"
      post: date
    保険料:
      regex: "(?:保険料|保険料合計|合計保険料)[\\s:：]*[¥\\\\]?\\s*([0-9,]+)"
      post: digits

# =============================================================================
# ↓↓↓ 以下は「各社のサンプル PDF を見てから」実際に埋めていくサンプル雛形 ↓↓↓
# =============================================================================

# 例: A損害保険
company_A:
  # detect.keywords のいずれかが PDF テキストに含まれたら、この会社と判定
  detect:
    keywords:
      - "A損害保険株式会社"
      - "A損保"
  fields:
    証券番号:
      regex: "証券番号[\\s:：]*([A-Za-z0-9\\-]+)"
      post: strip
    契約者名:
      regex: "ご契約者[\\s:：]*([^\\n\\r]+)"
      post: strip
    登録番号:
      regex: "登録番号[\\s:：]*([^\\n\\r]+)"
      post: strip
    保険料:
      regex: "保険料[\\s:：]*[¥\\\\]?\\s*([0-9,]+)"
      post: digits

# 例: B海上火災
company_B:
  detect:
    keywords:
      - "B海上火災保険"
  fields:
    証券番号:
      regex: "保険証券番号[\\s:：]*([A-Za-z0-9\\-]+)"
      post: strip
    契約者名:
      regex: "被保険者[\\s:：]*([^\\n\\r]+)"
      post: strip
    保険料:
      regex: "合計保険料[\\s:：]*[¥\\\\]?\\s*([0-9,]+)"
      post: digits
