# =============================================================================
# Excel 出力先の列マッピング定義
# =============================================================================
#
# 「抽出した項目を、集計 Excel のどの列に書き込むか」を定義します。
# 実際の集計 Excel を見てから、列の見出し名(header)を合わせるだけで対応できます。
#
# sheet         : 書き込むシート名。空にすると先頭シートを使用。
# header_row    : 見出し(項目名)が書かれている行番号(1始まり)。
# start_row     : データを書き始める行。省略時は既存データの最終行の次から追記。
# columns       : 「抽出項目名 : Excelの見出し名」の対応表。
#                 見出し名で列を自動的に探して書き込みます。
#                 (列を固定したい場合は "A" のように列文字で指定も可能)
# add_source    : true にすると、元 PDF のファイル名を「元PDF」列に記録します。
# =============================================================================

sheet: ""            # 例: "集計" / 空なら先頭シート
header_row: 1
start_row: null      # null = 既存の続きに追記
add_source: true

columns:
  証券番号: "証券番号"
  契約者名: "契約者名"
  登録番号: "登録番号"
  車台番号: "車台番号"
  保険期間_開始: "保険開始日"
  保険期間_終了: "保険終了日"
  保険料: "保険料"
  保険会社: "保険会社"
