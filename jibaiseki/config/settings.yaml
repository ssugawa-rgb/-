# =============================================================================
# 書き込み先(集計Excel)の設定
# =============================================================================

# --- フォルダ監視アプリの設定 ----------------------------------------------
# 自動入力先の集計Excel（フルパス）。★ここを自分のファイルに書き換える★
# 例: "C:\\Users\\you\\Documents\\自賠責集計.xlsx"
workbook_path: ""

watch_dir: "PDF投入"        # ここにPDFを入れると自動処理される
processed_dir: "処理済み"    # 処理が終わったPDFの移動先
backup_dir: "バックアップ"   # 書き込み前のExcelバックアップ先
poll_seconds: 3             # フォルダを見に行く間隔(秒)

# 書き込みエンジン: "xlwings"(Excel本体・無損失/Windows推奨) / "openpyxl"(コピー保存)
engine: "xlwings"

# --- 書き込み先シートと列 ---------------------------------------------------
# 自賠責（入力シート）に、PDFの1明細=1行 で追記します。
target_sheet: "自賠責（入力シート）"
header_row: 5          # 見出し行(「月 日 月日 拠点コード ...」の行)
# データ開始行より下の、既存データの最終行の次に追記します。

# 各列の列文字(A,B,...)。入力シートの並びに合わせています。
columns:
  月:        "A"
  日:        "B"
  月日:      "C"
  拠点コード: "D"
  事業部:    "E"
  拠点:      "F"
  保険会社:  "G"
  保険料:    "H"
  手数料:    "I"
  正味保険料: "J"

# --- 拠点コード → 事業部/拠点 のマスタ ------------------------------------
# 同じブック内の「入力マスタ」シートから自動で読み込みます(常に最新と同期)。
master_sheet: "入力マスタ"
master_code_col: "F"   # 拠点コード列
master_div_col:  "G"   # 事業部列
master_base_col: "H"   # 拠点列
master_start_row: 3    # マスタのデータ開始行
