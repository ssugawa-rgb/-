# =============================================================================
# 各保険会社ごとの 自賠責PDF 解析設定
# =============================================================================
#
# 各社から届く「自賠責保険料集計表」PDF を、座標(列位置)ベースで読み取ります。
# 会社ごとに PDF の列レイアウトが違うので、ここで列の x 座標範囲を定義します。
#
#   detect_keyword : PDF内にこの文字列があれば、この会社の様式と判定
#   company_name   : Excel(入力シート)の「保険会社」列に書き込む名称
#   fee_per_unit   : 1件あたりの手数料(円)。正味保険料 = 保険料 - 手数料
#   columns        : 各列の x0 座標の上限。左から順に判定される。
#                    cert=証券番号 / ken=件数 / prem=営業保険料 /
#                    date=入金日 / cum=累計 / code=営業所コード(拠点コード)
#
# 新しい会社を追加するときは、この形式でブロックを増やすだけです。
# （列位置は  python run.py --inspect <PDF>  で確認できます）
# =============================================================================

損保ジャパン:
  detect_keyword: "損害保険ジャパン"
  company_name: "損保ジャパン"
  fee_per_unit: 1735
  columns:
    cert: 120     # x0 < 120 → 証券番号
    ken: 200      # < 200   → 件数
    prem: 270     # < 270   → 営業保険料
    date: 360     # < 360   → 入金日
    cum: 460      # < 460   → 累計(未使用)
    code: 99999   # それ以上 → 営業所コード
